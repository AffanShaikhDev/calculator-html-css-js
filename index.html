<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, responsive calculator built with HTML, CSS and JavaScript." />
  <title>Calculator | Affan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div>
          <p class="eyebrow">HTML · CSS · JAVASCRIPT</p>
          <h1>Calculator</h1>
        </div>
        <span class="status-dot" aria-label="Ready"></span>
      </header>

      <div class="display" aria-live="polite">
        <div id="history" class="history"></div>
        <output id="screen" class="screen">0</output>
      </div>

      <div class="keys" id="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="backspace" aria-label="Delete last digit">⌫</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-operator="÷">÷</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key operator" data-operator="×">×</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key operator" data-operator="−">−</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key operator" data-operator="+">+</button>

        <button class="key zero" data-number="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
      <footer>Use your keyboard or click the buttons</footer>
    </section>
    <p class="credit">A simple project by <strong>Affan Shaikh</strong></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
